plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    versionProps['VERSION_CODE'] = '1'
    versionProps['VERSION_NAME'] = '1.0.0'
    versionProps['BUILD_DATE'] = '-'
    versionProps.store(new FileOutputStream(versionPropsFile), null)
}

// Versiyonu HER build'den önce artır (konfigürasyon fazı)
def currentCode = versionProps['VERSION_CODE'].toInteger()
def newCode = currentCode + 1
def newDate = new java.text.SimpleDateFormat("dd.MM.yyyy HH:mm").format(new Date())
versionProps['VERSION_CODE'] = newCode.toString()
versionProps['BUILD_DATE'] = newDate
versionProps['VERSION_NAME'] = newCode.toString()
versionProps.store(new FileOutputStream(versionPropsFile), null)

def vCode = newCode
def vName = newCode.toString()

// UPDATE MODU: Büyük modelleri APK dışına çıkar (Boyut küçültme)
def isUpdateOnly = true

println "Versiyon $vCode için build başlıyor... (UpdateOnly: $isUpdateOnly)"

android {
    namespace 'com.omoda.lanc'
    compileSdk 34

    defaultConfig {
        applicationId "com.omoda.lanc"
        minSdk 29
        targetSdk 33
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        def localProps = new Properties()
        def localPropsFile = project.rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localProps.load(localPropsFile.newDataInputStream())
        }

        buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
        buildConfigField "String", "GITHUB_TOKEN", "\"${localProps.getProperty('github.token', '')}\""
        buildConfigField "String", "HERMES_API_KEY", "\"${localProps.getProperty('hermes.api.key', '')}\""
        buildConfigField "String", "NINEROUTER_API_KEY", "\"${localProps.getProperty('ninerouter.api.key', '')}\""
        buildConfigField "String", "EDGE_TTS_TOKEN", "\"${localProps.getProperty('edge.tts.token', '')}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/INDEX.LIST'
            excludes += 'META-INF/io.netty.versions.properties'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }

    sourceSets {
        main {
            assets {
                if (isUpdateOnly) {
                    exclude 'sherpa_asr/**'
                    exclude 'sherpa_tts/**'
                    exclude 'sherpa_vad/**'
                    println "UPDATE MODU AKTİF: Modeller APK'ya dahil edilmiyor."
                } else {
                    println "FULL PAKET MODU: Tüm modeller APK'ya dahil ediliyor."
                }
            }
        }
    }

    aaptOptions {
        ignoreAssetsPattern "sherpa_asr:sherpa_tts:sherpa_vad"
    }
}

// Her başarılı build işleminden sonra versiyon kodunu otomatik artır ve APK kopyala
tasks.register('incrementVersionCodeAndCopyApk') {
    doLast {
        def versionPropsFileInner = file('version.properties')
        def versionPropsInner = new Properties()
        versionPropsInner.load(new FileInputStream(versionPropsFileInner))

        def apkFile = file("build/outputs/apk/debug/app-debug.apk")
        if (apkFile.exists()) {
            def destinationDir = file("${project.rootDir}/release_apks")
            if (!destinationDir.exists()) destinationDir.mkdirs()

            def curCode = versionPropsInner['VERSION_CODE'].toInteger()
            def prefix = isUpdateOnly ? "app-update" : "app-full"
            def newApkName = "${prefix}V${curCode}.apk"
            def destinationFile = new File(destinationDir, newApkName)
            java.nio.file.Files.copy(apkFile.toPath(), destinationFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "APK Kopyalandı: ${destinationFile.absolutePath}"

            // Son sürüm bilgisini bir JSON dosyasına yaz (OTA için kolaylık)
            def updateInfo = [
                versionCode: curCode,
                versionName: versionPropsInner['VERSION_NAME'],
                isUpdateOnly: isUpdateOnly,
                fileName: newApkName,
                date: versionPropsInner['BUILD_DATE']
            ]
            def jsonFile = new File(destinationDir, "latest_update.json")
            jsonFile.text = groovy.json.JsonOutput.toJson(updateInfo)
        }
    }
}

// Build tamamlandığında otomatik çalıştır
afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy incrementVersionCodeAndCopyApk
    }
}

dependencies {
    implementation project(':core')
    implementation project(':network')
    implementation project(':voice-offline')
    implementation files('../voice-offline/src/main/libs/sherpa-onnx-1.13.2.aar')

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation 'androidx.media:media:1.7.0'
    implementation 'org.json:json:20210307'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.8'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
