plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    versionProps['VERSION_CODE'] = '1'
    versionProps['VERSION_NAME'] = '1.0.0'
    versionProps['BUILD_DATE'] = '-'
    versionProps.store(new FileOutputStream(versionPropsFile), null)
}

def vCode = versionProps['VERSION_CODE'].toInteger()
def vName = versionProps['VERSION_NAME']

android {
    namespace 'com.omoda.lanc'
    compileSdk 34

    defaultConfig {
        applicationId "com.omoda.lanc"
        minSdk 29
        targetSdk 33
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_DATE", "\"${versionProps['BUILD_DATE']}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    aaptOptions {
        ignoreAssetsPattern "sherpa_stt:sherpa_tts:models"
    }
}

// Her başarılı build işleminden sonra versiyon kodunu otomatik artır ve APK kopyala
tasks.register('incrementVersionCodeAndCopyApk') {
    doLast {
        def versionPropsFileInner = file('version.properties')
        def versionPropsInner = new Properties()
        versionPropsInner.load(new FileInputStream(versionPropsFileInner))

        def currentCode = versionPropsInner['VERSION_CODE'].toInteger()
        def newCode = currentCode + 1

        versionPropsInner['VERSION_CODE'] = newCode.toString()
        versionPropsInner['BUILD_DATE'] = new java.text.SimpleDateFormat("dd.MM.yyyy HH:mm").format(new Date())
        versionPropsInner.store(new FileOutputStream(versionPropsFileInner), null)

        println "Versiyon Kodu Artırıldı: $newCode"

        // APK Kopyalama İşlemi
        def apkFile = file("build/outputs/apk/debug/app-debug.apk")
        if (apkFile.exists()) {
            def destinationDir = file("build/outputs/apk/debug/history")
            if (!destinationDir.exists()) destinationDir.mkdirs()

            def newApkName = "app-debugV${currentCode}.apk"
            def destinationFile = new File(destinationDir, newApkName)
            java.nio.file.Files.copy(apkFile.toPath(), destinationFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "APK Kopyalandı: ${destinationFile.absolutePath}"
        }
    }
}

// Build tamamlandığında otomatik çalıştır
afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy incrementVersionCodeAndCopyApk
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"

    // Tailscale TSNet (Go-based SDK via JNA/AAR)
    // Note: In a real project, we'd use a specific AAR or library.
    // For now, I'll assume we are using the official tailscale-android approach or a placeholder if not directly available.
    // implementation 'com.tailscale:tailscale-android:1.56.1'

    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'ai.picovoice:porcupine-android:3.0.1'
    implementation 'androidx.media:media:1.7.0'

    implementation 'org.json:json:20210307'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.8'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation files('libs/sherpa-onnx-1.13.2.aar')
}
